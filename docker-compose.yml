# Локальный Postgres для разработки и тестов.
# Порт 5433 на хосте, чтобы не конфликтовать с уже установленным Postgres.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_tracker
      POSTGRES_PASSWORD: job_tracker
      POSTGRES_DB: job_tracker
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Создаёт отдельную базу job_tracker_test для автотестов
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_tracker -d job_tracker"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
