name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:vercel

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: job_tracker
          POSTGRES_PASSWORD: job_tracker
          POSTGRES_DB: job_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_tracker -d job_tracker_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://job_tracker:job_tracker@localhost:5432/job_tracker_test
      TEST_DATABASE_URL: postgres://job_tracker:job_tracker@localhost:5432/job_tracker_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Схема в коде и SQL-миграции в репозитории должны совпадать
      - name: Check migrations are up to date
        working-directory: apps/api
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          git diff --exit-code -- drizzle || (echo "::error::Схема изменена без миграции: запустите npm run db:generate -w @job-tracker/api" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::Есть незакоммиченные файлы миграций" && exit 1)

      - run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: job_tracker
          POSTGRES_PASSWORD: job_tracker
          POSTGRES_DB: job_tracker_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_tracker -d job_tracker_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      E2E_DATABASE_URL: postgres://job_tracker:job_tracker@localhost:5432/job_tracker_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Браузер скачивается ~100 МБ — кэшируем по версии Playwright
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run e2e

      # Отчёт с трейсами упавших тестов: пошаговые снимки, сеть, консоль
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
